[package]
name = "nimble_parsec_rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Phase-1 Rust port of NimbleParsec combinators"

[lib]
name = "nimble_parsec_rs"
path = "src/lib.rs"

[dependencies]
nimble_parsec_rs_macro = { path = "parsec_macro" }
num-bigint = "0.4"
rand = "0.8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parser_bench"
harness = false
